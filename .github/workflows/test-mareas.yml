
name: Probar extracción de mareas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mareas:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar lector HTML
        run: pip install requests beautifulsoup4

      - name: Consultar tabla de mareas
        run: |
          python - <<'PY'
          import requests
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo

          url = "https://tablademareas.com/cl/nuble/cobquecura"
          response = requests.get(
              url,
              timeout=30,
              headers={"User-Agent": "Mozilla/5.0"}
          )
          print("Código HTTP:", response.status_code)
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          texto = " ".join(soup.stripped_strings)

          if "COBQUECURA" not in texto.upper():
              raise RuntimeError("No se reconoce la página de Cobquecura.")

          hoy = datetime.now(ZoneInfo("America/Santiago"))
          dia = hoy.day
          print("Fecha local:", hoy.strftime("%d-%m-%Y"))

          coincidencias = []
          for fila in soup.find_all("tr"):
              celdas = fila.find_all(["td", "th"], recursive=False)
              if not celdas:
                  continue

              primera = " ".join(celdas[0].stripped_strings)
              if re.match(rf"^\s*0?{dia}(?:\s|$)", primera):
                  coincidencias.append(fila)

          if len(coincidencias) != 1:
              raise RuntimeError(
                  f"Se esperaba una fila para el día {dia}; "
                  f"se encontraron {len(coincidencias)}. "
                  "Hay que revisar la estructura de la tabla."
              )

          fila = coincidencias[0]
          contenido = " ".join(fila.stripped_strings)
          todos_horarios = re.findall(
              r"\b\d{1,2}:\d{2}\s*h\b",
              contenido
          )
          alturas = re.findall(
              r"\b\d+(?:[,.]\d+)?\s*m\b",
              contenido
          )

          print("Total de horarios encontrados:", len(todos_horarios))
          print("Alturas identificadas:", alturas)

          if len(todos_horarios) != 6 or len(alturas) != 4:
              raise RuntimeError(
                  "La fila no contiene los seis horarios esperados "
                  "y las cuatro alturas de marea."
              )

     
          horarios_marea = todos_horarios[-4:]

          print("Fila exacta encontrada:")
          print(contenido)
          print("Horarios de marea:", horarios_marea)
          print("Alturas identificadas:", alturas)
          print("ÉXITO: cuatro horarios y cuatro alturas identificados.")
               
          print("PRUEBA CORRECTA: fila diaria identificada.")
          print("Todavía no se han modificado los datos del panel.")
          PY

